name: Chat com o Digest

on:
  schedule:
    # a cada 30 min — intervalo escolhido pra caber no limite gratuito de
    # minutos do GitHub Actions em repositório privado (ver README)
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions no GitHub

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python chat_bot.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.API_BOT_TELEGRAM }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ID }}
          TELEGRAM_CATEGORY_CHAT_IDS: ${{ secrets.TELEGRAM_CATEGORY_CHAT_IDS }}
