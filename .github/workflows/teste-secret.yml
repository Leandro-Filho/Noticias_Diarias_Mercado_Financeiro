name: Teste de Secret

on:
  workflow_dispatch: {}

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Checar se o secret chega
        run: |
          if [ -z "$MEU_TESTE" ]; then
            echo "RESULTADO: vazio — o secret não chegou no workflow"
          else
            echo "RESULTADO: chegou! tamanho recebido: ${#MEU_TESTE} caracteres"
          fi
        env:
          MEU_TESTE: ${{ secrets.MEU_TESTE }}