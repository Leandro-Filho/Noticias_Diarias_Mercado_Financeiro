name: Resumo de Mercado

on:
  schedule:
    # 08:07 no horário de Brasília (11:07 UTC) — de propósito FORA da hora
    # cheia. O GitHub documenta que horário cheio (xx:00) é quando a fila de
    # agendamento fica mais congestionada e o atraso é maior; alguns minutos
    # de diferença já ajuda bastante.
    - cron: "7 11 * * 1-5"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions no GitHub

permissions:
  contents: write # necessário pro passo final poder salvar o ultimo_digest.json de volta no repositório

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # mais fontes = mais tempo; ainda desiste sozinho em vez de rodar até 6h
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python market_digest.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.API_BOT_TELEGRAM }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ID }}
          TELEGRAM_CATEGORY_CHAT_IDS: ${{ secrets.TELEGRAM_CATEGORY_CHAT_IDS }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }} # usado pelo Radar do Mercado (rankings da B3)

      - name: Salvar digest e memória de dedup no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ultimo_digest.json noticias_enviadas.json
          git diff --staged --quiet || git commit -m "Atualiza digest do dia"
          git push

      # Planilha da carteira: gerada com os dados PRIVADOS do secret
      # CARTEIRA_PRIVADA e enviada direto pro Telegram — nunca commitada
      # (o repositório é público). Se falhar, não derruba o digest.
      - name: Gerar e enviar carteira.xlsx no Telegram
        if: always()
        continue-on-error: true
        run: python carteira_excel.py
        env:
          CARTEIRA_PRIVADA: ${{ secrets.CARTEIRA_PRIVADA }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.API_BOT_TELEGRAM }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ID }}